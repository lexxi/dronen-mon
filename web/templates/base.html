<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Drohnen-Monitor{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="{{ url_for('static', filename='css/dronen.css') }}"
        rel="stylesheet"
    >
    {% block head_extra %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="/">Drohnen-Monitor</a>

        <div class="navbar-nav">
            <a class="nav-link" href="/">Dashboard</a>
            <a class="nav-link" href="/wifi">WLAN</a>
            <a class="nav-link" href="/sdr">SDR</a>
            <a class="nav-link" href="/correlations">Korrelation</a>
            <a class="nav-link" href="/remote-id">Remote ID</a>
            <a class="nav-link" href="/documentation">Dokumentation</a>
        </div>
    </div>
</nav>

<main class="container-fluid px-4">
    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/dronen.js') }}"></script>
{% block scripts_extra %}{% endblock %}
</body>
</html>
